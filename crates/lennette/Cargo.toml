[package]
name = "lennette"
description = "A desktop assistant with live transcription, chat, and meeting notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
gpui.workspace = true
lucide-icons.workspace = true
pulldown-cmark = "0.13.4"
raw-window-handle.workspace = true
reqwest.workspace = true
futures-util.workspace = true
base64.workspace = true
uuid.workspace = true
parking_lot.workspace = true
directories.workspace = true
aes-gcm = "0.11.1"
rand = "0.10.3"
sha2 = "0.11.1"
hound = "3.5.1"
cpal = "0.18.2"
xcap = "0.9.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["allow-unsafe-code"] }
ksni = { version = "0.3.7", features = ["blocking"] }
zbus = "5.19"
