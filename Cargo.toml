name = "nixarchy-meetingai"
license = "AGPL-3.0-or-later"
authors = ["nixarchy-meetingai contributors"]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "multipart"] }
rmcp = { version = "=3.8.0", features = ["server", "transport-io", "macros"] }
# Parakeet. "shared" + SHERPA_ONNX_LIB_DIR (nix/sherpa-lib.nix) links the nixpkgs library; the default "static" downloads at build time.
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"] }
