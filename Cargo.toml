[workspace]
resolver = "3"
members = ["crates/lennette"]
default-members = ["crates/lennette"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["lennette contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "multipart"] }
futures-util = "0.3.34"
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
parking_lot = "0.12.5"
directories = "6.0.0"
lucide-icons = "1.60.0"
raw-window-handle = "0.6"


gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev]
debug = 0
incremental = true

# Transitive build fix, see vendor/README.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
