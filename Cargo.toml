[package]
name = "lennette"
description = "An ambient real-time meeting and discussion copilot"
version = "0.7.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["lennette contributors"]

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = "0.3.34"
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
parking_lot = "0.12.5"
directories = "6.0.0"
lucide-icons = "1.60.0"
pulldown-cmark = "0.13.4"
raw-window-handle = "0.6"
aes-gcm = "0.11.1"
rand = "0.10.3"
sha2 = "0.11.1"
hound = "3.5.1"
cpal = "0.18.2"
xcap = "0.9.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-onig"] }
pdf-extract = "0.12.1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["allow-unsafe-code"] }
ksni = { version = "0.3.7", features = ["blocking"] }
zbus = "5.19"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev]
debug = 0
incremental = true

# Transitive build fix, see vendor/README.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
