pre-commit:
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

    clippy:
      glob: "*.{rs,toml}"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    nixfmt:
      glob: "*.nix"
      run: nixfmt --check {staged_files}

pre-push:
  commands:
    checks:
      run: ./scripts/pre-push-checks.sh
